[project]
name = "life-tracker-api"
version = "1.0.0"
description = "Life Tracker Backend API"
authors = [
    {name = "Shiyu Chen", email = "shiyuserenechen@gmail.com"}
]
requires-python = ">=3.11,<3.13"

dependencies = [
    # Web Framework
    "fastapi>=0.109.0,<0.110",
    "uvicorn[standard]>=0.27.0,<0.28",
    "python-multipart>=0.0.6",

    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.25,<2.1",
    "alembic>=1.13.1,<1.14",
    "asyncpg>=0.29.0,<0.30",
    "psycopg[binary]>=3.1.0,<3.3",

    # Authentication & Security
    "python-jose[cryptography]>=3.3.0,<3.4",
    "passlib[bcrypt]>=1.7.4,<1.8",

    # Configuration & Validation
    "pydantic>=2.5.3,<2.6",
    "pydantic-settings>=2.1.0,<2.2",
    "python-dotenv>=1.0.0,<1.1",
    "email-validator>=2.1.1,<3.0",

    # AI Service
    "anthropic>=0.39.0,<0.40",
    "httpx>=0.26.0,<0.27",

    # Utilities
    "pytz>=2023.3",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.4,<8.0",
    "pytest-asyncio>=0.23.3,<0.24",
    "pytest-cov>=4.1.0,<5.0",

    # Code Quality
    "black>=23.12.1,<24.0",
    "ruff>=0.1.11,<0.2",
    "mypy>=1.8.0,<2.0",

    # Dev Tools
    "ipython>=8.18.1,<9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I"]
ignore = []
exclude = [".git", ".venv", "__pycache__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true